version: "3.8"

services:
  alpharadar:
    build: .
    container_name: alpharadar
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./models:/app/models:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
