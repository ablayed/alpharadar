[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alpharadar"
version = "0.1.0"
description = "AlphaRadar daily financial briefing Telegram bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot[job-queue]>=22.6",
    "httpx>=0.28.0",
    "aiosqlite>=0.22.0",
    "aiolimiter>=1.2.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.13.0",
    "finnhub-python>=2.4.20",
    "edgartools>=4.3.0",
    "onnxruntime>=1.20.0",
    "transformers>=4.47.0",
    "tokenizers>=0.21.0",
    "numpy>=1.26.0",
    "langgraph>=0.4.0",
    "langchain-core>=0.3.0",
    "google-genai>=1.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["^tests/"]
